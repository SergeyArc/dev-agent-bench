# Linter configuration. Do not modify this file.
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "PL", "D"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "D100", "D104", "D105", "D107"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D"]
"**/versions/*.py" = ["D"]
"**/migrations/**" = ["D"]
"**/alembic/**" = ["D"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[lint.isort]
known-first-party = ["tracksvc"]
